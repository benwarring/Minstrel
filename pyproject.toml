[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minstrel"
version = "0.1.0"
description = "Statically reads code from an entry point and lays its functions out as pages in run order."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "pygments>=2.17",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
minstrel = "minstrel.cli:app"

# Ship the whole package directory, so the non-Python viewer assets under
# src/minstrel/render/viewer/ (template.html, viewer.js, viewer.css,
# linearize.js) land in the wheel alongside the modules.
[tool.hatch.build.targets.wheel]
packages = ["src/minstrel"]

# Allowlist the sdist contents. Without it, hatchling ships every file in the
# project root that git does not ignore, which would pull in .env, .venv/
# and .pipeline/.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/pyproject.toml", "/README.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
